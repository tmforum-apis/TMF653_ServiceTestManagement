    MetricDefMeasureConsequence:
      description: >-
        A MetricDefMeasureConsequence defines the action (prescribed action or notification) to take
        when a 

        MetricDefMeasureThresholdRule is crossed.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            description:
              type: string
              description: A narrative that explains in detail what the consequence is.
            name:
              type: string
              description: >-
                A word, term, or phrase by which a MetricDefMeasureConsequence is known and
                distinguished from other MetricDefMeasureConsequences.
            prescribeAction:
              type: string
              description: >-
                Recommended remedy for a violated threshold. This could be the hyperlink to the
                action.
            repeatAction:
              type: boolean
              description: >-
                An indicator used to specify that a consequence should cease being applied if a
                value is in the same range as the previous value or continue being applied if a
                value is in the same range as the previous value. 

                If the repeatAction is True, if the consequence is always applied as soon as the
                MetricMeasure value is in the range of values and if the repeatAction is False, the
                consequence is applied only if the previous MetricMeasure value was not in the same
                range.
            validFor:
              $ref: '#/components/schemas/TimePeriod'
      discriminator:
        propertyName: '@type'
        mapping:
          MetricDefMeasureConsequence: '#/components/schemas/MetricDefMeasureConsequence'
