    TestMeasure:
      description: >-
        A TestMeasure specifies a measure of a specific aspect of a product, service, or resource
        test, such as lost packets or connectivity status
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            accuracy:
              type: number
              format: float
              description: >-
                The percentage accuracy expressed in float notation, specifying the degree closeness
                between the measured value and the actual value. eg. if scale range is up to 500,
                accuracy could be defined as +-0.5%, expressed as 0.005 in float notation
            captureDateTime:
              type: string
              format: date-time
              description: The date and time that the metric was captured
            testMeasureDefinitionId:
              type: string
              description: >-
                reference to the associated testMeasureDefinition in serviceTestSpecification. This
                property is unique among a list of testMeasures. Each testMeasureDefinition is
                referenced at most once within a run time ServiceTest instance.
            captureMethod:
              type: string
              description: >-
                The method used to capture the Metrics, examples: probes, automated data capture,
                optical mark recognition, barcode recognition, voice recognition(This may be
                replaced by a set of entities similar to the Performance Monitoring Ref)
            metricName:
              type: string
              description: The name of the metric
            metricDescription:
              type: string
              description: Brief description of the metric
            metricUri:
              type: string
              description: Hyperlink to access a metric for detail information
            metricHref:
              type: string
              description: Obsolete to be removed in v6. Replaced by metricUri
              deprecated: true
            ruleViolation:
              type: array
              description: A list of rules that were violated in this test measure
              items:
                $ref: '#/components/schemas/MeasureThresholdRuleViolation'
            unitOfMeasure:
              type: string
              description: 'The unit of measure for the metric values, such as bit, byte, erlang [ISO 80000].'
            value:
              $ref: '#/components/schemas/Characteristic'
            testMeasureCharacteristic:
              type: array
              description: >-
                A list of additional characteristics that characterize this test measurement
                (usageCharacteristic [*]) 
              items:
                $ref: '#/components/schemas/Characteristic'
      discriminator:
        propertyName: '@type'
        mapping:
          TestMeasure: '#/components/schemas/TestMeasure'
