components:
  schemas:
    Addressable:
      type: object
      description: Base schema for addressable entities
      properties:
        href:
          type: string
          description: Hyperlink reference
        id:
          type: string
          description: unique identifier
    AppliedConsequence:
      description: >-
        An Applied Consequence defines the action (prescribed action or notification) to take when
        a 

        MeasureThresholdRuleViolation occurs.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            appliedAction:
              type: string
              description: |-
                The action for a violated threshold. This could be a hyperlink to 
                the action.
            description:
              type: string
              description: A narrative that explains in detail what the consequence is.
            name:
              type: string
              description: |-
                A word, term, or phrase by which Consequence is known and 
                distinguished from other MetricDefMeasureConsequences.
            repeatAction:
              type: boolean
              description: >-
                An indicator used to specify that a consequence should cease 

                being applied if a value is in the same range as the previous value or continue
                being applied if a value is in the same range as the previous value.  

                If the repeatAction is True, if the consequence is always applied as soon as the
                MetricMeasure value is in the range of values and if the repeatAction is False, the
                consequence is applied only if the previous MetricMeasure value was not in the same
                range.
      discriminator:
        propertyName: '@type'
        mapping:
          AppliedConsequence: '#/components/schemas/AppliedConsequence'
    AppliedConsequence_EVO:
      description: >-
        An Applied Consequence defines the action (prescribed action or notification) to take when
        a 

        MeasureThresholdRuleViolation occurs.
      allOf:
        - $ref: '#/components/schemas/Extensible'
        - type: object
          properties:
            appliedAction:
              type: string
              description: |-
                The action for a violated threshold. This could be a hyperlink to 
                the action.
            description:
              type: string
              description: A narrative that explains in detail what the consequence is.
            name:
              type: string
              description: |-
                A word, term, or phrase by which Consequence is known and 
                distinguished from other MetricDefMeasureConsequences.
            repeatAction:
              type: boolean
              description: >-
                An indicator used to specify that a consequence should cease 

                being applied if a value is in the same range as the previous value or continue
                being applied if a value is in the same range as the previous value.  

                If the repeatAction is True, if the consequence is always applied as soon as the
                MetricMeasure value is in the range of values and if the repeatAction is False, the
                consequence is applied only if the previous MetricMeasure value was not in the same
                range.
      discriminator:
        propertyName: '@type'
        mapping:
          AppliedConsequence: '#/components/schemas/AppliedConsequence_EVO'
    AssociationSpecificationRef:
      type: object
      description: reference to an AssociationSpecification object
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AssociationSpecificationRef: '#/components/schemas/AssociationSpecificationRef'
    AssociationSpecificationRef_EVO:
      type: object
      description: reference to an AssociationSpecification object
      allOf:
        - $ref: '#/components/schemas/EntityRef'
      discriminator:
        propertyName: '@type'
        mapping:
          AssociationSpecificationRef: '#/components/schemas/AssociationSpecificationRef_EVO'
    Attachment:
      description: >-
        Complements the description of an element (for instance a product) through video,
        pictures...
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            name:
              type: string
              description: The name of the attachment
            description:
              type: string
              description: A narrative text describing the content of the attachment
              example: Photograph of the Product
            url:
              type: string
              description: >-
                The URL pointing to the attachment content held in an external system, such as a
                content management system or document repository. Mutually exclusive with content.
              example: 'https://host/Content/4aafacbd-11ff-4dc8-b445-305f2215715f'
            content:
              type: string
              format: base64
              description: >-
                The actual contents of the attachment object, embedded inline and encoded as base64.
                Mutually exclusive with url.
            size:
              $ref: '#/components/schemas/Quantity'
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            attachmentType:
              type: string
              description: >-
                a business characterization of the purpose of the attachment, for example logo,
                instructionManual, contractCopy
            mimeType:
              type: string
              description: >-
                A technical characterization of the attachment content format using an IETF Media
                Type, for example application/pdf or image/png. Note: this property is named
                mimeType for historical reasons.
          required:
            - attachmentType
            - mimeType
      discriminator:
        propertyName: '@type'
        mapping:
          Attachment: '#/components/schemas/Attachment'
    Attachment_EVO:
      description: >-
        Complements the description of an element (for instance a product) through video,
