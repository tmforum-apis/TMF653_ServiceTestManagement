    ServiceTest:
      description: >-
        A service test is an entity that exists for a controlled test invocation on a service. The
        service test is executed according to a schedule and contains service test configuration
        parameters that are to be applied at execution time, and service test measures that result.
      allOf:
        - $ref: '#/components/schemas/Entity'
        - type: object
          properties:
            characteristic:
              type: array
              description: List of characteristics with values that define the test run
              items:
                $ref: '#/components/schemas/Characteristic'
            description:
              type: string
              description: Description of the service test
            endDateTime:
              type: string
              format: date-time
              description: The end date and time of the service test
            mode:
              type: string
              description: >-
                An indication of whether the service test is running in 'PROACTIVE' or 'ONDEMAND'
                mode
              example: Proactive
            validFor:
              $ref: '#/components/schemas/TimePeriod'
            relatedParty:
              type: array
              description: >-
                A list of related party references (RelatedParty [*]). A related party defines party
                or party role linked to a specific entity
              items:
                $ref: '#/components/schemas/RelatedPartyRefOrPartyRoleRef'
            externalIdentifier:
              type: array
              description: A list of external identifiers assoicated with this service
              items:
                $ref: '#/components/schemas/ExternalIdentifier'
            startDateTime:
              type: string
              format: date-time
              description: The start date and time of the service test.
            state:
              $ref: '#/components/schemas/ExecutionStateType'
            testMeasure:
              type: array
              description: The results of the test in terms of the measured metrics
              items:
                $ref: '#/components/schemas/TestMeasure'
            serviceTestRelationship:
              type: array
              description: >-
                A relationship to an array of service test references eg. service tests executed on
                related composite or atomic services
              items:
                $ref: '#/components/schemas/ServiceTestRelationship'
            relatedService:
              $ref: '#/components/schemas/ServiceRef'
            testSpecification:
              $ref: '#/components/schemas/ServiceTestSpecificationRef'
            name:
              type: string
              description: The name of the service test
          required:
            - relatedService
            - testSpecification
            - name
      discriminator:
        propertyName: '@type'
        mapping:
          ServiceTest: '#/components/schemas/ServiceTest'
