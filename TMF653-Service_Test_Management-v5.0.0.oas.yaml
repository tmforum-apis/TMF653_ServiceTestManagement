        $ref: '#/components/schemas/JsonPatch'
      type: array
      description: JSONPatch Operations document as defined by RFC 6902
  parameters:
    Id:
      name: id
      required: true
      schema:
        type: string
      in: path
      description: Identifier of the Resource
    Fields:
      name: fields
      in: query
      description: Comma-separated properties to be provided in response
      schema:
        type: string
    Offset:
      name: offset
      in: query
      description: Requested index for start of resources to be provided in response
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      description: Requested number of resources to be provided in response
      schema:
        type: integer
    Before:
      name: before
      in: query
      description: An opaque string value representing the page results before the cursor value
      schema:
        type: string
    After:
      name: after
      in: query
      description: An opaque string value representing the page results after the cursor value
      schema:
        type: string
    Sort:
      name: sort
      in: query
      description: >-
        The default direction is Ascending order, the use of the modifier in front of the sort field
        name, “-“, changes the sort order direction.
      schema:
        type: string
    Filter:
      name: filter
      in: query
      description: Filter a collection using JSONPath
      schema:
        type: string
        example: 'attachment[?(@size==300)]'
  requestBodies:
    ServiceTest_FVO:
      description: The ServiceTest to be created
